name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: App (VocalBridge.exe + vbsetup.exe)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Optional ASIO support. Set the repository variable ENABLE_ASIO=true to
      # download Steinberg's ASIO SDK (by doing so you accept its license).
      - name: Fetch ASIO SDK (optional)
        if: ${{ vars.ENABLE_ASIO == 'true' }}
        shell: pwsh
        run: |
          $url = "${{ vars.ASIO_SDK_URL }}"
          if (-not $url) { $url = "https://www.steinberg.net/asiosdk" }
          Invoke-WebRequest -Uri $url -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $dir = (Get-ChildItem asiosdk -Recurse -Filter iasiodrv.h | Select-Object -First 1).Directory.Parent.FullName
          "ASIO_ARGS=-DVOCALBRIDGE_ASIO_SDK_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ${{ env.ASIO_ARGS }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build/app/VocalBridge_artefacts/Release/VocalBridge.exe out/
          Copy-Item build/tools/vbsetup/Release/vbsetup.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: app-x64
          path: out/

  driver:
    name: Driver (VocalBridge.sys, test-signed)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-wdk

      - name: Build driver package
        working-directory: driver
        run: msbuild VocalBridgeDriver.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          $pkg = Get-ChildItem driver -Recurse -Directory -Filter package |
                 Where-Object { Test-Path (Join-Path $_.FullName "VocalBridge.inf") } | Select-Object -First 1
          if (-not $pkg) { throw "driver package folder not found" }
          Copy-Item "$($pkg.FullName)\*" out/
          $cer = Get-ChildItem $pkg.Parent.FullName -Filter *.cer | Select-Object -First 1
          if ($cer) { Copy-Item $cer.FullName out/VocalBridgeTestCert.cer }
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: driver-x64
          path: out/

  # Microsoft attestation signing: produces a driver that installs with Secure Boot ON
  # and no test mode. Opt-in: set repository variable ATTESTATION_ENABLED=true and the
  # secrets below (see README > "Driver signing without disabling Secure Boot").
  driver-attested:
    name: Driver (Microsoft attestation-signed)
    if: ${{ vars.ATTESTATION_ENABLED == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-wdk

      - name: Build driver (unsigned - Microsoft adds the signature)
        working-directory: driver
        run: msbuild VocalBridgeDriver.sln /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off

      - name: Pack CAB
        shell: pwsh
        run: ./scripts/attestation/make-attestation-cab.ps1 -DriverDir driver/Source/Main/x64/Release -OutDir attest

      # EV certificates live in an HSM. This uses one stored in Azure Key Vault
      # (Premium / HSM-backed); swap in your CA's cloud signing tool if you use another.
      - name: EV-sign CAB (Azure Key Vault)
        shell: pwsh
        env:
          KV_URL: ${{ secrets.EV_KEYVAULT_URL }}
          KV_CERT: ${{ secrets.EV_KEYVAULT_CERT_NAME }}
          KV_TENANT: ${{ secrets.EV_KEYVAULT_TENANT_ID }}
          KV_CLIENT: ${{ secrets.EV_KEYVAULT_CLIENT_ID }}
          KV_SECRET: ${{ secrets.EV_KEYVAULT_CLIENT_SECRET }}
        run: |
          dotnet tool install --global AzureSignTool
          AzureSignTool sign -kvu $env:KV_URL -kvc $env:KV_CERT -kvt $env:KV_TENANT -kvi $env:KV_CLIENT -kvs $env:KV_SECRET `
            -tr http://timestamp.digicert.com -td sha256 -fd sha256 -v attest/VocalBridge.cab
          if ($LASTEXITCODE -ne 0) { throw "AzureSignTool failed" }

      - name: Build SDCM (Partner Center submission tool)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/SDCM.git sdcm
          git -C sdcm checkout c5ab7e663ba727e866bb2d979d81906a4ded9a73
          msbuild sdcm/SurfaceDevCenterManager.sln /restore /m /p:Configuration=Release

      - name: Submit for attestation signing and download
        shell: pwsh
        env:
          SDCM_CREDS_TENANTID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SDCM_CREDS_CLIENTID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          SDCM_CREDS_KEY: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          ./scripts/attestation/submit-attestation.ps1 -Sdcm sdcm/SurfaceDevCenterManager/bin/Release/sdcm.exe `
            -CabPath attest/VocalBridge.cab -OutDir attested

      - uses: actions/upload-artifact@v4
        with:
          name: driver-x64-attested
          path: attested/

  package:
    name: Release zip
    needs: [app, driver, driver-attested]
    # Runs even when the opt-in attestation job was skipped.
    if: ${{ always() && needs.app.result == 'success' && needs.driver.result == 'success' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-x64
          path: VocalBridge

      - uses: actions/download-artifact@v4
        with:
          name: driver-x64
          path: VocalBridge/driver

      # Prefer the Microsoft-signed driver when the attestation job ran.
      - uses: actions/download-artifact@v4
        if: ${{ needs.driver-attested.result == 'success' }}
        with:
          name: driver-x64-attested
          path: attested

      - name: Assemble
        shell: pwsh
        run: |
          if (Test-Path attested/VocalBridge.inf) {
            Remove-Item VocalBridge/driver -Recurse -Force
            Copy-Item attested VocalBridge/driver -Recurse
            Write-Host "Using the attestation-signed driver"
          }
          Copy-Item scripts/*.ps1 VocalBridge/
          Copy-Item README.md VocalBridge/

      - uses: actions/upload-artifact@v4
        with:
          name: VocalBridge-win64
          path: VocalBridge/
